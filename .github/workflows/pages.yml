name: GitHub Pages (solo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify public HTML and JavaScript
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request, urllib.parse
          url = os.environ['PAGES_URL']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      html = response.read().decode()
                  assert 'id="root"' in html
                  script = re.search(r'src="([^"]+\.js)"', html).group(1)
                  with urllib.request.urlopen(urllib.parse.urljoin(url, script), timeout=20) as response:
                      assert len(response.read()) > 1000
                  print('Public HTML and built JavaScript verified:', url)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
